<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
<title id="title">Reverse an array with two pointers</title><desc id="desc">Swap indices 0 and 4, then 1 and 3. Index 2 remains unchanged. The result is 5, 0, -1, 8, 3.</desc>
<rect width="800" height="380" fill="#f8fafc" rx="8"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#087f8c"/></marker></defs>
<g font-family="system-ui,sans-serif" fill="#172b41" text-anchor="middle">
<text x="400" y="36" font-size="22" font-weight="600">Reverse an array with two pointers</text>
<g fill="#e5f3ef" stroke="#087f8c"><rect x="60" y="145" width="100" height="65"/><rect x="205" y="145" width="100" height="65"/><rect x="350" y="145" width="100" height="65"/><rect x="495" y="145" width="100" height="65"/><rect x="640" y="145" width="100" height="65"/></g>
<g font-size="24"><text x="110" y="185">3</text><text x="255" y="185">8</text><text x="400" y="185">-1</text><text x="545" y="185">0</text><text x="690" y="185">5</text></g>
<g font-size="13"><text x="110" y="233">index 0</text><text x="255" y="233">index 1</text><text x="400" y="233">index 2</text><text x="545" y="233">index 3</text><text x="690" y="233">index 4</text></g>
<g stroke="#087f8c" fill="none" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"><path d="M110 135V80H690V135"/><path d="M255 244V270H545V244"/></g>
<text x="400" y="72" font-size="14">First swap: left = 0, right = 4</text>
<text x="400" y="293" font-size="14">Second swap: left = 1, right = 3</text>
<text x="400" y="337" font-size="21" font-weight="600">Output: [5, 0, -1, 8, 3]</text>
<text x="400" y="363" font-size="13">Move inward after each swap; stop when left meets right.</text></g></svg>
