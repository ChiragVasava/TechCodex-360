<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc"><title id="title">Git: from editing to a shared commit</title><desc id="desc">A commit is local until it is pushed</desc><rect width="800" height="380" fill="#f8fafc" rx="8"/><g font-family="system-ui,sans-serif" fill="#172b41"><text x="35" y="40" font-size="21" font-weight="600">Git: from editing to a shared commit</text><rect x="28" y="130" width="132" height="70" rx="6" fill="#e5f3ef" stroke="#087f8c"/><text x="94" y="171" text-anchor="middle" font-size="14">Working tree</text><path d="M162 165h16m-6 -5 6 5-6 5" fill="none" stroke="#62758b" stroke-width="2"/><rect x="181" y="130" width="132" height="70" rx="6" fill="#e5f3ef" stroke="#087f8c"/><text x="247" y="171" text-anchor="middle" font-size="14">Stage</text><path d="M315 165h16m-6 -5 6 5-6 5" fill="none" stroke="#62758b" stroke-width="2"/><rect x="334" y="130" width="132" height="70" rx="6" fill="#e5f3ef" stroke="#087f8c"/><text x="400" y="171" text-anchor="middle" font-size="14">Local commit</text><path d="M468 165h16m-6 -5 6 5-6 5" fill="none" stroke="#62758b" stroke-width="2"/><rect x="487" y="130" width="132" height="70" rx="6" fill="#e5f3ef" stroke="#087f8c"/><text x="553" y="171" text-anchor="middle" font-size="14">Push</text><path d="M621 165h16m-6 -5 6 5-6 5" fill="none" stroke="#62758b" stroke-width="2"/><rect x="640" y="130" width="132" height="70" rx="6" fill="#e5f3ef" stroke="#087f8c"/><text x="706" y="171" text-anchor="middle" font-size="14">Remote</text><text x="400" y="270" text-anchor="middle" font-size="15">A commit is local until it is pushed</text></g></svg>